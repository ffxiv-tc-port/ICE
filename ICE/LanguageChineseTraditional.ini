This is judged based off your current completion rate of bronze/silver/gold.\nIt calculates the average score you get across all, and assuming you get that you were to consistently get that average across the hour, \nthen it will tell you what it would be for that one mission. \nThis is just really nerdy way of getting a more accurate average based off your completion rate==這是依照你目前銅星／銀星／金星的達成比例計算的。\n它會算出你整體的平均成果，再假設你能整個小時都維持這個平均值，\n然後告訴你這個任務的預估產出。\n說穿了就是用達成率算出更精準平均值的宅氣算法
THIS IS YOUR HEADS UP ON HOW THIS WORKS. If I change this in the future, this tooltip will also change.\n1: This will check for your current CLASS [not menu class, actual current class] for relic turnin.\n2: You must not have the tool eqipped for this to run full auto. \n	- This is due to the fact that I cba coding this in at this time. (might change my mind in the future *shrugs*)\n3: This will take prio over "Stop @ Relic Turnin", in the sense that if you have both enabled, it will turnin vs stop. And continue about it's day\n4: If you're on a crafting class, it will return you back to the stop you were crafting post turnin. \n	- This is optional, you can disable it at your own free will, I just like this so I can just go back to an isolated area of my choosing==先說明一下運作方式。如果之後有改動，這段說明也會跟著更新。\n1：它會以你「目前實際的職業」（不是選單裡選的職業）來判斷是否回報宇宙工具。\n2：必須沒有裝備該工具才能全自動執行。\n	- 純粹是因為我現在懶得寫這段。（之後可能會改變主意 *聳肩*）\n3：這個選項的優先度高於「宇宙工具完成時停止」——兩者都啟用時，它會選擇回報而不是停止，然後繼續運作。\n4：如果你是製作職業，回報後它會把你帶回原本製作的地點。\n	- 這是選用的，你隨時可以關掉。我只是喜歡這樣，才能回到自己挑好的角落
