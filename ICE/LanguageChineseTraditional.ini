The countdown needs the game's own server clock, and it could not be read this pass (or the timestamp is out of range).\nThe start time itself is still correct - it is an absolute timestamp.==倒數要靠遊戲自己的伺服器時鐘，而這一輪讀不到（或時間戳超出合理範圍）。\n開始時刻本身仍然是正確的——那是一個絕對時刻。
Shows when the next mecha event starts, as a clock time and a countdown.\nThe game's own panel tells you there is a next event but never says when.\nThe start time is readable well before the event begins (measured: 19 minutes ahead), and the countdown runs off the game's server clock, not your PC clock.\nDisplay only - it never signs you up.==顯示下一場機甲事件幾點開始，並附上倒數。\n遊戲自己的面板只會說「有下一場」，從來不說幾點。\n開始時間在事件開始前很久就讀得到（實測提前 19 分鐘），而倒數是拿遊戲的伺服器時鐘算的，不是你電腦的時鐘。\n純顯示——絕不會幫你報名。
Shows the current Red Alert (magnetic storm / meteor shower / spore mist): which one it is and how long is left.\n\nOFF BY DEFAULT ON PURPOSE. This one reads a game structure whose size we could not verify offline on the TC client. If the layout differs there, the read goes out of bounds and that crashes the game outright - it cannot be caught.\nEverything else in this window has been verified offline; this has not. Turn it on only if you are willing to hit that.==顯示目前的緊急事件（磁暴／流星雨／孢子霧）：是哪一種、還剩多久。\n\n預設關閉是刻意的。這一項會讀一塊我們在台服客戶端上無法離線驗證大小的遊戲結構。若台服的佈局不同，讀取就會越界，而那會直接把遊戲弄崩，攔不下來。\n這個視窗裡其他每一項都已經離線驗證過，只有這一項沒有。願意承受那個風險再開。
Keep Critical missions enabled==緊急任務不受金星排除影響
Critical (emergency) missions stay in the pool even after you gold them.\nThose missions only show up during a Red Alert - magnetic storm, meteor shower or spore mist - so once the golded ones are removed there can be nothing left to take when an alert actually starts.\nOff by default: behaviour is unchanged unless you turn this on.==緊急任務即使已經拿到金星，也一樣留在候選池裡。\n這類任務只在緊急警報（磁暴／流星雨／孢子霧）期間才會出現，所以把已金星的踢掉之後，警報真的來的時候可能反而一個任務都接不到。\n預設關閉：不勾的話行為完全不變。
