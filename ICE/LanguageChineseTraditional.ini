Stops the plugin after this many consecutive rerolls that found no mission. 0 disables the limit.\nWithout it an empty candidate pool makes the plugin reroll forever with no indication at all - the usual cause is 'disable mission after gold' combined with every currently available mission already being golded.\nConsider 'Prioritize missions without a gold star' instead: it only reorders, it never removes missions from the pool.==連續重骰這麼多次都找不到任務就停止外掛。填 0 表示不限制。\n沒有這個上限時，候選池一旦空掉就會無限重骰、卡在原地而且完全沒有提示 —— 最常見的原因是開啟了「取得金星後自動停用該任務」，而目前可接的任務又剛好都已經拿過金星。\n建議改用「沒金星的優先」：它只調整順序，不會把任務移出候選池。
Pick missions using the table sort order==依表格排序方式挑任務
Within the same rank, missions are picked in the order set by 'Sort By' in the table settings (Exp I-V, Cosmo/Lunar credits, map location, class score...). Off means the game's own list order.\nCan be combined with the gold star option above: the table order applies first, then missions without a gold star are moved to the front.==同一階級之內，會依「表格設定 → 排序方式」選的順序挑任務（經驗 I～V／宇宙點數／月面點數／地圖位置／職業分數…）。關閉時使用遊戲清單原本的順序。\n可與上面的金星選項並用：先套用表格排序，再把還沒拿到金星的排到前面。
Mecha Skill Range Hints==機甲行動技能範圍
Show Mecha Skill Ranges==顯示機甲技能範圍
Draws range hints on the ground for mecha event skills while piloting or assisting.\nDisplay only - never casts skills or moves for you.==騎乘或協助機甲時，把機甲技能的攻擊範圍畫在地面上。\n純顯示——不會代替你施放技能或移動。
Flamethrower Cone Angle==火焰噴射器扇形全角
Full cone angle for the Cosmic Flamethrower - the game data does not contain it.\nMeasured logs suggest 240 degrees or more; the default is 240.\nThis applies to every cone-shaped mecha skill (today only the Flamethrower).==宇宙火焰噴射器的扇形全角——遊戲資料裡沒有這個角度。\n實測記錄顯示 240 度以上比較接近，預設就是 240。\n這個值對所有扇形機甲技能都生效（目前只有火焰噴射器是扇形）。
Cosmic Drill Range==宇宙鑽頭有效距離
Effective length of the Cosmic Drill rectangle, in yalms.\nThe game data says 7, but measured logs put the real trigger distance at roughly 3.5-4 - so the default is 4. Set it back to 7 for the raw game value.\nThe half-width stays on the game data and is not adjustable.==宇宙鑽頭矩形範圍的有效長度（單位：米）。\n遊戲資料寫 7，但實測記錄顯示真正的觸發距離大約 3.5~4，所以預設是 4。想用遊戲原值就拉回 7。\n半寬維持走遊戲資料，不開放調整。
Per-skill Toggles==個別技能開關
Show Target Markers==顯示目標點位
Marks where the targets actually are, and colours them by whether your skill range currently covers them: green = covered, red = not covered.\nThe circle is the target's hitbox, the dot is its exact position.\nDisplay only - it never targets, casts or moves for you.==把目標實際所在的位置標出來，並依「目前的技能範圍有沒有蓋到」上色：綠色＝蓋到、紅色＝沒蓋到。\n圓圈是目標的 hitbox，中間那一點才是它的精確座標。\n純顯示——不會幫你選目標、施放技能或移動。
Draw Hitbox Circles==畫出 hitbox 圈
The game decides a hit against the target's hitbox, not against its centre point, so a big target can be hit while its centre is outside your range.\nTurn this off if you only want the centre dots.==遊戲的命中判定看的是目標的 hitbox，不是中心點，所以體積大的目標即使中心點在範圍外也可能被打到。\n只想看中心點的話就把這個關掉。
Count Hitbox As Covered==涵蓋判定計入 hitbox
On: a target counts as covered as soon as its hitbox touches the shape - this matches how the game itself is understood to work.\nOff: only the centre point counts, which is the stricter reading.\nIf what you see in game disagrees with the colours, try flipping this.==開啟：目標的 hitbox 只要碰到形狀就算蓋到——這與目前對遊戲判定方式的理解一致。\n關閉：只看中心點在不在形狀裡，是比較嚴格的那一邊。\n如果實機打起來跟顏色對不上，就把這個切換看看。
Show Target Names==顯示目標名稱
Marker Range==標示範圍
How far out to look for targets, in yalms.\n60 is the longest mecha skill range, so the default already covers everything you could possibly hit.==要往外找多遠的目標（單位：公尺）。\n60 是目前最長的機甲技能射程，所以預設值已經涵蓋任何你打得到的東西。
Targetable Objects Only==只顯示可選取的物件
This filter no longer applies to mission objectives: anything an objective marker has matched, and anything of the same kind, is always listed even if it cannot be targeted and has no name at all.\nTurn this off only if some ordinary object you can clearly attack is still missing - it then shows every nearby object instead.==這個濾網已經不再套用在任務目標上：只要是目的指示標記對上的東西、以及同一種類的物件，即使不能選取、連名字都沒有，也一律會列出來。\n只有在還有明明打得到的一般物件沒被標出來時才關掉它——關掉之後會改成顯示附近所有物件。
Hide Scenery And NPCs==隱藏場景與 NPC
Only matters while 'Targetable Objects Only' is off.\nOn (default): still hides things that are never a target - NPCs, aetherytes, gathering points, housing, area and cutscene objects, and unnamed scenery you cannot target.\nMission objectives are never hidden by this, even when they have no name.\nOff: shows literally every object nearby.==只有在「只顯示可選取的物件」關掉時才有作用。\n開啟（預設）：仍然會濾掉絕不可能是目標的東西——NPC、乙太之光、採集點、房屋、區域與過場物件，以及不能選取又沒有名字的場景裝飾。\n任務目標永遠不會被這一項濾掉，就算它沒有名字也一樣。\n關閉：真的把附近每一個物件都顯示出來。
Include Other Players==包含其他玩家
Targets covered / targets within this skill's reach.\nGreen rings on the ground are covered, red ones are not.\nThe ring is the target's hitbox - that is what the game checks, not the centre dot.==已涵蓋的目標數／這一招打得到的目標數。\n地上綠圈是有蓋到，紅圈是沒蓋到。\n圈畫的是目標的 hitbox——遊戲判定看的是它，不是中間那一點。
Mecha Ops==機甲行動
Ready==就緒
Show Mecha Skill Cooldowns==顯示機甲技能冷卻
Shows a small window with the remaining cooldown of each mecha skill.\nOnly appears while mecha skills are actually available.==用一個小視窗顯示各機甲技能的剩餘冷卻時間。\n只有在機甲技能真的可用時才會出現。
Show Mecha Proc Alerts==顯示機甲 proc 提示
Highlights when a mecha skill becomes usable through a proc\n(on TC that is Carrot Clearance, which enables Carrot Cannon Overload).==當機甲技能因為 proc 而變成可用時特別標示出來\n（台服是「胡蘿蔔授權」，它會讓「強力胡蘿蔔加農砲」可以發動）。
Mecha Event==機甲事件
Applied==已報名
Selected==已中籤
Cutscene==過場中
Joined==已加入
Show Mecha Event Status==顯示機甲事件狀態
Shows how far along the pilot sign-up flow you are: applied, selected, cutscene, joined.==顯示駕駛報名流程走到哪一步：已報名、已中籤、過場中、已加入。
Show Mecha Event Progress==顯示機甲事件進度
Shows the event and personal progress bars, your contribution, and the remaining time.\nDisplay only - it never signs you up and never acts for you.\nThe values are read only after the game's event pointer passes a range check; if it does not, nothing is shown at all.==顯示事件進度條、個人進度、貢獻度與剩餘時間。\n純顯示——不會幫你報名，也不會代替你做任何動作。\n這些數值只有在遊戲的事件指標通過範圍驗證之後才會讀取；沒通過就完全不顯示。
Event Progress==事件進度
Personal==個人進度
Contribution==貢獻度
Event ends in==事件剩餘
Sign-up closes in==報名截止
Teleport closes in==傳送截止
Ended==已結束
Closed==已截止
Active==進行中
Participating==已參加
Sign-up==報名
Teleport==傳送
The game does not clear this flag when the window closes, so the bit alone does not mean it is still open.\n* = the flag is set but the window could not be determined (no server time, or the timestamp is empty).==時間結束後遊戲不會清掉這個旗標，所以位元亮著並不代表現在還開放。\n「*」＝旗標有設，但拿不到伺服器時間或時間戳是空的，判定不了。
Counted against the game's own server clock, not your PC clock.\nIf the server time is unavailable or the value is out of range, the raw integer is shown as-is.\nRaw value: ??==倒數是拿遊戲自己的伺服器時鐘算的，不是你電腦的時鐘。\n拿不到伺服器時間、或數值超出合理範圍時，就直接顯示原始整數。\n原始值：??
Unsupported==未支援
ICE does not ship an AutoHook preset for this fishing mission, so it cannot be automated. This is expected, not a malfunction.==ICE 沒有內建這個釣魚任務的 AutoHook 設定，所以無法自動進行。這是預期行為，不是故障。
This client has no data for this mission (usually a planet that is not released yet), so it cannot be automated.==這個客戶端查不到這個任務的資料（通常是還沒開放的星球），所以無法自動進行。
This mission needs AutoHook's folder preset import, which the installed AutoHook does not provide. Update AutoHook to the version shipped alongside this ICE release.==這個任務需要 AutoHook 的「資料夾 preset 匯入」功能，但目前安裝的 AutoHook 沒有提供。請把 AutoHook 更新到與這版 ICE 同一波出貨的版本。
This mission is on the ICE unsupported list and will not be automated. This is expected, not a malfunction.==這個任務在 ICE 的未支援清單裡，不會被自動執行。這是預期行為，不是故障。
You can still finish it by hand; ICE just will not drive it.==你還是可以自己手動完成它，ICE 只是不會代勞。
Auto mission select skipped ?? enabled mission(s) ICE cannot run: ??==自動選任務跳過了 ?? 個 ICE 跑不動的任務：??
?? mission(s) on the board cannot be automated by ICE:==任務板上有 ?? 個任務 ICE 跑不動：
ICE ships no built-in preset for this mission. Uncheck the box below and type the name of your own AutoHook preset to make ICE run it.==ICE 沒有內建這個任務的釣魚設定。請取消下面的勾選，並填入你自己的 AutoHook preset 名稱，ICE 才跑得動它。
No runnable mission is enabled for the current job in this zone, so ICE is stopping. (Relic XP mode is off.)==目前職業在這個區域沒有任何可執行的啟用任務，ICE 停止運作。（宇宙工具經驗模式沒有開啟。）
Some enabled missions were skipped because ICE cannot run them - see the message above.==有啟用的任務因為 ICE 跑不動而被跳過，詳見上一則訊息。
Objectives==目的指示
Objectives confirmed in the object table / map markers read from the event.\n'?' means there is an event running but no marker could be read at all - that is not the same as zero.\nBy default only confirmed objectives are drawn, so a low number here explains why the overlay looks empty.==已在物件表確認的目的指示數／從事件讀到的地圖標記數。\n「?」代表事件正在進行、但一個標記都讀不到，跟「0 個」不是同一件事。\n預設只畫已確認的目的指示，所以這裡數字偏低就是疊加層看起來空空的原因。
Objects you marked yourself from the right-click menu.==你自己從右鍵選單標示的物件。
Objective ??==目標 ??
The mecha event currently running.\nIts objective objects often have no name in the game data at all, in which case the overlay falls back to numbering them.==目前正在進行的機甲行動。\n它的目標物件在遊戲資料裡經常根本沒有名字，這種情況下疊加層會改用編號來標示。
Pilot==駕駛員
Ground Support==協助員
What your own role is supposed to do this event.\nThe pilot and the ground support have different objectives, so the objects you should be going for are not the same ones.\nYour role is worked out from the mecha actions currently on your hotbar; if it cannot be worked out, this line is not shown at all.==你這個身份在這一場事件該做的事。\n駕駛員與協助員的任務目標本來就不同，所以你該去打／去互動的東西也不是同一批。\n身份是依照你熱鍵上現有的機甲技能判定的；判不出來的話這一行根本不會出現。
Show Objective Markers==顯示目的指示
Draws the mecha event's own objective markers in the world: an outlined ring where the objective is, plus a short arrow at your feet pointing at it.\nUseful as ground support too, where you have no mecha skills at all.\nDisplay only - it never moves you and never picks a target.==把機甲事件自己的目的指示畫在場景裡：目的地畫一個描邊圓圈，腳邊再畫一支指向它的短箭頭。\n擔任協助員（完全沒有機甲技能）時同樣有用。\n純顯示——不會幫你移動，也不會幫你選目標。
Only Confirmed Objectives==只顯示已確認的目的指示
On (recommended): only draws a marker once a real object has been found at that spot in the game's object table, and then follows that object as it moves.\nOff: also draws markers that matched nothing, in grey, at the raw marker position. Those can be stale or simply wrong.\nLeaving this on also means that if a future patch shifts the fields ICE reads, the overlay quietly shows nothing instead of scattering wrong rings on the ground.==開啟（建議）：只有在遊戲的物件表裡真的找到位於該處的物件時才畫，而且會跟著那個物件移動。\n關閉：連沒對上任何物件的標記也用灰色畫在原始座標上，那些可能是過期的，也可能根本就是錯的。\n維持開啟還有一個作用：日後改版若讓 ICE 讀的欄位位移，疊加層會安靜地什麼都不顯示，而不是在地上灑一堆錯的圈。
Objective Match Radius==目的指示配對半徑
How close an object has to be to a marker to count as that objective, in yalms.\nThere is no official value for this - 5 is a guess. Raise it if objectives are never confirmed, lower it if the wrong thing gets marked.==物件要離標記多近才算是那個目的指示（單位：公尺）。\n這個值沒有官方資料，5 是猜的。目的指示一直確認不了就調大，標錯東西就調小。
Show Direction Arrow==顯示方向箭頭
Show Objective Names==顯示目的指示名稱
Mecha Right-click Menu==機甲行動右鍵選單
Adds ICE entries to the right-click menu while you are in a cosmic zone: mark an object in the mecha overlay, and copy the mecha event diagnostics.\nDisplay only - nothing there acts for you.==人在宇宙區域時，於右鍵選單加入 ICE 的項目：把物件標示到機甲疊加層，以及複製機甲事件診斷資訊。\n純顯示——裡面沒有任何項目會代替你動作。
Show Full Player Names==顯示完整角色名
Off (default): other players' character names are shortened to initials both on the overlay and in ICE's own log history.\nMecha ops is group content, so the log - which has a 'copy to clipboard' button - would otherwise carry other people's character names out of the game with it.\nYour own name is never shortened.==關閉（預設）：其他玩家的角色名在疊加層與 ICE 自己的記錄歷程裡都會縮寫成首字母。\n機甲行動是多人內容，而記錄那邊有一顆「複製記錄到剪貼簿」的按鈕；不縮寫的話，別人的角色名就會跟著被帶出遊戲。\n你自己的名字永遠不會被縮寫。
ICE: Mark for mecha overlay==ICE：標示到機甲疊加層
ICE: Unmark for mecha overlay==ICE：取消機甲疊加層標示
ICE: Clear all mecha marks==ICE：清除所有機甲標示
ICE: Copy mecha event info==ICE：複製機甲事件資訊
Mecha event info copied==已複製機甲事件資訊
Markers come from scanning every marker slot. That never dereferences a game pointer, so it cannot crash - but the list can still contain leftovers from an earlier stage.\nThose are drawn with a faded ring and a '?' next to them.\nThe exact list exists but reading it needs an opt-in that can crash the game; see 'Use the game's own marker list' in the settings.==標記是逐格掃描所有標記格位得來的。那條路徑不會解參考任何遊戲指標，所以絕對不會崩；代價是清單裡可能混有上一階段留下的舊標記。\n那些會畫成淡色外框，旁邊帶一個「?」。\n遊戲自己有一份精準的有效標記清單，但要讀它必須另外開一個「開了可能讓遊戲關閉」的選項，見設定裡的「使用遊戲自己的標記清單」。
You enabled the game's own marker list, but it failed its shape check this pass, so ICE fell back to scanning all marker slots.\nThe fallback is safe, but positions may include stale entries.==你開啟了「使用遊戲自己的標記清單」，但這一輪的形狀檢查沒通過，ICE 已自動退回逐格掃描。\n退回的路徑是安全的，只是座標裡可能混有過期的舊標記。
Use the game's own marker list==使用遊戲自己的標記清單
Off (default, recommended): ICE scans every marker slot. It never follows a game pointer it cannot verify first, so this can never crash - but the list may include leftovers from an earlier stage. Those are drawn faded, with a '?' next to them.\n\nOn: ICE reads the list the game itself keeps of which markers are live. That list is exact and never stale.\nThe catch is that the list lives in the game's heap, and there is no way for ICE to check that memory is still valid before reading it. If that assumption ever stops holding, the failure is an access violation, which cannot be caught - the game closes on the spot.\n\nOnly turn this on if stale markers are actually getting in your way.==關閉（預設，建議）：ICE 逐格掃描所有標記格位。它不會去追任何無法事先驗證的遊戲指標，所以絕對不會崩；代價是清單可能混有上一階段留下的舊標記，那些會畫成淡色並帶一個「?」。\n\n開啟：ICE 改讀遊戲自己維護的「哪些標記現在有效」清單。那份清單是精確的，不會有過期的東西。\n問題在於那份清單放在遊戲的堆積記憶體裡，而 ICE 沒有任何辦法在讀取之前確認那塊記憶體還有效。這個前提一旦不成立，失敗形式是存取違規 —— 那是攔不住的，遊戲會當場關閉。\n\n只有在舊標記真的造成困擾時才開它。
This reads game memory that ICE cannot verify beforehand. If the assumption behind it ever breaks, the game closes immediately and nothing can catch it. Turn it back off unless you are specifically fighting stale markers.==這會去讀 ICE 無法事先驗證的遊戲記憶體。背後的前提一旦不成立，遊戲會立刻關閉，而且沒有任何東西攔得住。除非你正在對付舊標記的問題，否則請關回去。
No content for this tab yet.==此分頁目前沒有對應的內容。
