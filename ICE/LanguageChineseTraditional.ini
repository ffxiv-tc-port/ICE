The weather line on the overlay: what it is now, what comes next, and how long until it changes.\nOn by default - turning it off only hides the line.==疊加層上的天氣那一列：目前是什麼天氣、下一個是什麼、還有多久會換。\n預設開啟——關掉只是把這一列藏起來。
