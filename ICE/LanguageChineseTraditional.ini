Held==持有
You can only carry one - the game's own panel shows this as 0/1 or 1/1.\nExchange it at the mecha ops counter in the exploration zone, paying that zone's own credits (Sinus Ardorum: 22, 20 - lunar credits).\nIt is spent when you are picked as the pilot, and it is spent anyway if you decline or let the timer run out after being picked.\n'?' means the game has not sent this data yet - that is not the same as not having one.==身上只能帶一張——遊戲自己的面板就是把它顯示成 0/1 或 1/1。\n在探索區域的機甲行動櫃檯用該區域自己的信用點數兌換（渴望灣：(22, 20)，月球信用點數）。\n被選為駕駛員時會消耗掉；中籤後辭退或沒在時限內出動，一樣會消耗。\n「?」代表遊戲還沒把這份資料送過來——那跟「沒有」是兩回事。
Show Pilot Application==顯示駕駛申請書
Shows whether you are carrying a pilot application - you can only hold one, and it is what lets you sign up as the mecha pilot.\nIt is not an inventory item, so the game only shows it inside its own mecha ops panel; this puts it where you can see it before the sign-up window opens.\nDisplay only - it never signs you up and never buys anything.==顯示身上有沒有駕駛申請書——只能帶一張，而它就是報名機甲駕駛員的門票。\n它不是背包道具，所以遊戲只會在自己的機甲行動面板裡顯示；這一列讓你在報名視窗打開之前就看得到。\n純顯示——絕不替你報名，也不會替你買任何東西。
