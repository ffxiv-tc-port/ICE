Recording normally starts by itself once an event signal shows up, and stops about 20 seconds after it goes away.\nTurn this on to record right now regardless - useful for checking that the feature works at all without waiting for an event.==錄製平常會在事件訊號出現時自己開始，訊號消失約 20 秒後停止。\n開啟這一項就立刻開始錄，不管有沒有事件——用來確認這個功能真的會動，不必等到事件開始。
