One line per nearby object: id, data id, kind, name (may be empty), position, distance, and whether ICE would filter it out and by which rule.\nThis is the bulkiest part of the record - turn it off to keep only the summary and the difference lists.==附近每個物件一行：id、資料 id、種類、名稱（可能是空的）、座標、距離，以及 ICE 會不會把它濾掉、被哪一條規則濾掉。\n這是記錄裡最佔份量的部分；關掉就只留總結與差集清單。
Recording Sweep Radius==錄製掃描半徑
How far out objects get recorded, in metres.\nDeliberately wider than ICE's own target range, so the record also shows what ICE left out.==要錄多遠以內的物件（公尺）。\n刻意比 ICE 自己的目標範圍更寬，這樣記錄裡才看得到 ICE 漏掉了什麼。
Everything is written at Information level with the [MechaRec] prefix.\nThe per object detail lines go to dalamud.log only - ICE's own log view keeps just 3000 entries and would lose everything else.==全部以 Information 等級寫出，前綴是 [MechaRec]。\n逐物件的明細只寫進 dalamud.log——ICE 自己的記錄檢視只留 3000 筆，灌進去會把其他東西全部擠掉。
