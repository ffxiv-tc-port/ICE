Share of attempts that ended in a gold turn-in, counting abandoned runs as attempts.\nTime lost to abandons so far: ??\nUsed by the optional 'Minimum gold rate' rule in Mission Picking Rules, and by the 'Effective Score/Min' sort order. Display is never filtered by that rule.==在所有嘗試裡以金星交件的比例，放棄掉的那幾次也算一次嘗試。\n目前放棄累計耗時：??\n「任務挑選規則」裡的「最低金星率」與「有效每分成果」排序都會用到這個值。表格顯示永遠不受那條規則影響。
Effective==有效
Same as Average, but the time spent on abandoned runs is added to the denominator.\nIf you abandon when gold becomes unreachable, that time is a real cost of your farming loop, and leaving it out systematically overrates missions you gold inconsistently.\nTime lost to abandons so far: ??\nThis is what the 'Effective Score/Min' sort order ranks by.==與「平均」相同，但把放棄掉的那些時間也加進分母。\n如果你設定成「金星不可達就放棄」，那段時間就是刷分迴圈裡的真實成本；不計入它會系統性高估那些你金星不穩的任務。\n目前放棄累計耗時：??\n「有效每分成果」排序就是依這個值排的。
Effective Score/Min==有效每分成果
'Effective Score/Min' ranks by your own recorded results, including the time lost to abandoned runs. Missions with no records yet count as 0 and sort last, so run a few rounds on a normal order first to build up data.\nA silver turn-in is worth 80% of a gold one (4x vs 5x), so a fast silver can beat a slow gold - this order reflects that automatically.\nEvery other option ranks by fixed sheet data and needs no history.==「有效每分成果」依你自己的實測記錄排序，並且把放棄掉的耗時算進成本。還沒有記錄的任務一律算 0、排在最後，所以請先用一般順序跑幾輪累積數據。\n銀星＝金星的 80%（4 倍 vs 5 倍），所以快的銀星可能勝過慢的金星，這個排序會自動反映這件事。\n其餘選項都是依固定的任務表資料排序，不需要任何歷史記錄。
Minimum gold rate==最低金星率
Missions you gold less often than this are moved to the BACK of their rank when picking, so they are only taken when nothing better is available. 0 turns this off.\nGold rate counts abandoned runs as attempts, and only applies once a mission has at least 3 recorded attempts - one bad run never sinks a mission.\nThey are demoted, never removed: removing them could empty the candidate pool and send the plugin into endless rerolling.\nRequires 'Pick missions using the table sort order' above. The mission table itself is never filtered by this.==金星率低於這個值的任務，挑任務時會被排到同階級的最後面，只有在沒有更好的選擇時才會被接走。0 表示關閉。\n金星率把放棄也算進嘗試次數，而且要累積至少 3 次嘗試之後才開始判定 —— 失敗一次不會讓任務被判死。\n它們只是被降級，不會被移除：移除有可能把候選池掏空，讓外掛陷入無限重骰。\n需要先開啟上面的「依表格排序方式挑任務」。任務表格本身永遠不會被這條規則篩掉。
