Stop the mission==收手不做了
Crafting missions hand you a fixed, limited amount of materials. Once a few crafts have come out poorly the gold star can already be out of reach, and the plugin will still keep crafting until the materials are gone.\nThis estimates the best score still reachable: current rating + (crafts you can still afford) x (the highest rating a single item can be worth, which is the gold threshold divided by the number of items the mission asks for).\nIt only applies while the only thing you are still waiting for is gold, i.e. 'Auto turnin' or 'Turnin at gold' is on for that mission.\nAnything it cannot work out (rating not readable, teleporting, critical or time-graded missions) counts as 'still possible' and nothing happens.\n'Stop the mission' hands over to the routine the plugin already uses when materials run out. Be aware of what that routine actually does: it clicks 'Report results' once and then abandons on the next tick if the mission is still running, so a silver or bronze you had already earned can still be thrown away.==製作任務發給你的材料是固定而且有限的。只要有幾次製作品質不好，金星其實就已經拿不到了，但外掛還是會一路做到材料見底。\n這裡估的是「還拿得到的最高分」：目前評價 ＋（剩下的材料還能再做幾件）×（單件評價的上限，也就是金星門檻除以任務要求繳交的件數）。\n只有在「這一輪除了金星以外不會交件」時才會生效，也就是該任務開了「自動回報」或「金星回報」。\n任何算不出來的情況（評價讀不到、正在傳送、高難任務、以時間評分的任務）一律當成「還有機會」，什麼都不會發生。\n「收手不做了」會交給外掛在材料用完時本來就會走的那條流程。⚠️ 請先知道那條流程實際上做什麼：它只會按一次「回報成果」，下一個 tick 任務還在就直接放棄 —— 所以已經到手的銀星／銅星有可能一起丟掉。
Switch class instead of stopping==候選池空了就換職業，不要直接停止
When the reroll limit above is reached, look for the next class in your class priority order \nthat still has missions without a gold star and switch to it, instead of stopping right away. \nStopping is still what happens once every class has been tried.\nIt only switches to a class you own a gear set for whose main hand weapon is actually on you - \nanything else is skipped with a line in the log.\nThis equips gear, so it is off by default.==重骰次數達到上面那個上限時，先照「職業優先度」的順序找下一個還有未金星任務的職業\n換過去繼續跑，而不是立刻停止。所有職業都試過之後還是一樣會停止。\n只會換到「你有那個職業的套裝，而且套裝的主手武器真的在身上」的職業；\n其他的會跳過，並在記錄檔留下一行說明。\n這個功能會實際更換裝備，所以預設是關閉的。
Other confirmation dialogs==其他確認框
Always confirm (current behaviour)==一律按下確定（現行行為）
Log the text only==只把文字記錄下來
Cancel anything unrecognised==認不出來的一律按取消
The option above only covers taking and abandoning missions. Everywhere else the plugin presses Yes on whatever confirmation dialog happens to be open without reading it: repairing, switching gear sets, collectables while fishing, the Cosmic Fortune wheel and handing in research materials.\n'Always confirm' is the behaviour the plugin has always had - the dialog text is not even read, so it costs nothing.\n'Log the text only' changes nothing at all. It still presses Yes, it just writes the text of every dialog it did not recognise into the log, so you can check the matching is right before you let it act on it.\n'Cancel anything unrecognised' presses No instead, and writes a line into the log. Pressing No rather than doing nothing is deliberate: a stray dialog left open would block the plugin forever.\nWhat counts as 'expected' is read from the game's own text data, so it follows your client language automatically.==上面那個選項只涵蓋「接任務」與「放棄任務」。其餘的地方，外掛都是不看內容就對當下開著的確認框按下確定：修理裝備、更換套裝、釣魚時的收藏品、宇宙好運道轉盤，以及繳交研究材料。\n「一律按下確定」就是外掛一直以來的行為 —— 連確認框上寫什麼都不會去讀，所以完全沒有成本。\n「只把文字記錄下來」不會改變任何行為。它照樣按下確定，只是把每一個認不出來的確認框文字寫進記錄檔，讓你先確認比對準不準，再決定要不要真的讓它動作。\n「認不出來的一律按取消」則改成按下取消，並在記錄檔留一行。按取消而不是什麼都不做是刻意的：放著不管的確認框會把外掛永遠卡在那裡。\n什麼算是「預期之內」是從遊戲自己的文字資料讀出來的，所以會自動跟著你的客戶端語言走。
No text to match against for: ??. Those are only logged, never cancelled.==下列情境沒有可以比對的文字：??。它們只會被記錄下來，永遠不會被按取消。
