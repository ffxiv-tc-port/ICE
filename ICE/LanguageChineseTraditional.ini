On (default): the mecha ops status becomes a collapsible section inside the ICE overlay window, next to the relic tool XP one - one window less to arrange.\nOff: it gets its own small window again, which can be pinned and clicked through.\nThe two are never shown at the same time. If the ICE overlay itself is turned off, the separate window takes over automatically, so this never hides mecha ops.==開啟（預設）：機甲行動狀態變成 ICE 疊加層視窗裡的一個可摺疊區塊，就在「宇宙工具經驗值」旁邊——少一個視窗要擺。\n關閉：改回原本那個獨立小視窗（可釘選、可點擊穿透）。\n兩者永遠不會同時出現。如果 ICE 疊加層本身是關的，獨立視窗會自動接手，所以這一項不會讓機甲行動消失。
