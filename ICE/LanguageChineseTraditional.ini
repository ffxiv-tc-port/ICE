- - ICE Commands Help - - \n/ice help - show all available commands\n/ice -> opens the main settings\n/ice s -> opens the settings menu\n - - - Mission specific - - - \n/ice stop - Stops ICE\n/ice start - starts ICE \nThe rest of the commands work by doing a single id/multiple in a row \nEX. /ice add 10 155 185\n/ice add (ids) - enables select missions\n/ice remove (ids) - removes/disables select missions\n/ice toggle (ids) - toggles select mission ids/ice only (ids) - makes only select missions enabled/ice flag (id) - opens the map and flags the mission (if it has one).\n==- - ICE 指令說明 - - \n/ice help - 顯示所有可用指令\n/ice -> 開啟主設定視窗\n/ice s -> 開啟設定選單\n - - - 任務相關 - - - \n/ice stop - 停止 ICE\n/ice start - 啟動 ICE \n以下指令可以一次帶入一個或多個任務 ID \n例如：/ice add 10 155 185\n/ice add (ids) - 啟用指定的任務\n/ice remove (ids) - 停用指定的任務\n/ice toggle (ids) - 切換指定任務的啟用狀態/ice only (ids) - 只啟用指定的任務/ice flag (id) - 開啟地圖並標記該任務的位置（若有）。\n
