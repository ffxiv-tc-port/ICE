Calls TataruPraise once per mission that is turned in with a gold rating.\nDoes nothing at all when TataruPraise is not installed, and never affects turn-in or scheduling.\nTataruPraise also has to have its own master switch on, be off cooldown, and have voiced lines in the "宇宙" category.==每一個以金評交件的任務呼叫 TataruPraise 一次。\n沒安裝 TataruPraise 時完全不作用，也永遠不會影響交件與排程。\nTataruPraise 自己的總開關也要開著、冷卻要過了，而且誇獎池裡要有「宇宙」這個情境的句子。
Notify When Mecha Sign-up Opens==機甲行動報名開放時通知
Off by default. Prints one chat line when the mecha ops pilot sign-up window opens, with the event name and the sign-up deadline.\nNotification only - it never signs you up, and there is deliberately no button here that would. Open the game's own mecha ops panel and sign up yourself.\nIt is said once per event, and only while you are in a cosmic zone.\nThis one works whether or not the range overlay above is on.==預設關閉。機甲行動的駕駛報名視窗一開放，就在聊天視窗印一行字，附上事件名稱與報名截止時間。\n只通知，不會替你報名，這裡也刻意沒有任何會替你報名的按鈕。請自行打開遊戲的機甲行動面板報名。\n每一場事件只講一次，而且只在你人在宇宙探索區域時才會講。\n這一項與上面的技能範圍疊加層無關，那個關著它照樣有效。
Mecha ops sign-up is now open: ?? - closes at ?? (?? left). ICE only tells you; sign up yourself from the game's own mecha ops panel.==機甲行動報名已開放：?? — 報名截止 ??（剩餘 ??）。ICE 只負責通知，請自行到遊戲的機甲行動面板報名。
Cosmic craft solver==宇宙製作求解器
Default (do not override)==預設（不覆寫）
Expert solver==專家求解器
Cosmic recipes are all expert recipes, but unless you assign a solver yourself Artisan picks whichever one has the highest priority for that recipe, which is not always the expert solver.\nThis is applied through Artisan's temporary solver IPC: it is never written into your Artisan settings, and it is handed back when the mission ends, when ICE stops and when the plugin unloads.\nIf your Artisan is too old to offer that IPC, or that solver is not available for the recipe, the craft runs exactly as it did before and one line is written to the log.==宇宙配方全部是專家配方，但你沒有自己指派求解器時，Artisan 會挑該配方裡優先度最高的那一個，而那不一定是專家求解器。\n這是透過 Artisan 的「臨時求解器」IPC 套用的：不會寫進你的 Artisan 設定，而且任務結束、ICE 停止、外掛卸載時都會還回去。\n如果你的 Artisan 太舊、沒有這個 IPC，或該配方沒有這個求解器可選，製作會完全照以前的方式進行，只在記錄檔留一行說明。
