Records everything ICE's mecha target logic reads, from the start of an event to the end, so the raw inputs can be replayed offline.\nRead only - it never casts, never moves you, and never signs you up for anything.==把 ICE 機甲目標判定讀到的東西，從事件開始到結束整段錄下來，讓原始輸入可以離線重放。\n純讀取：不會施放技能、不會幫你走位、也不會幫你報名。
