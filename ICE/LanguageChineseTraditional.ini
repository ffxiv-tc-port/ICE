Short answer: It's built in now\nLong answer: Honestly, this was a cumbersome system in itself. And with square deciding to not continue on with dual crafting missions going into the 2nd moon, I figured it would be better to just tie it into the scoring system. You realistically only need:\nGold: 3 Items\nSilver: 2 Items\nBronze: 1 Item\nto be able to hit the threshold. And even then, if you manage to not hit it on the first attempt, it'll just keep gathering. Plus. This makes it to where I can not have to worry about profile managing on fishing for... 4 missions? Seemed minorly reduntant in my eyes.\nSo now how it'll work. Select the turnin option (Gold/Any both work the same) and it will now gather up to the necessary amount -> turnin when it's ready.\nNOW NONE OF YOU CAN TELL IT TO CRAFT 27 ITEMS. STOP IT. IT SAID CRAFT (╯°Д°)╯︵/(.□ . \)==簡答：現在已經內建了\n詳答：老實說這套機制本身就很麻煩。而且 SE 決定第二顆月球不再推出雙職業製作任務，我覺得直接綁進計分系統會更好。實際上你只需要：\n金星：3 個道具\n銀星：2 個道具\n銅星：1 個道具\n就能達到門檻。就算第一次沒達到，它也會繼續採集。而且這樣一來，我也不用為了……4 個釣魚任務？去管理配置檔，感覺實在有點多餘。\n所以現在的運作方式是：選擇回報選項（金星／自動兩者效果相同），它就會採集到足夠的數量 -> 準備好之後回報。\n所以拜託不要再叫它做 27 個道具了。住手。人家說的是製作 (╯°Д°)╯︵/(.□ . \)
