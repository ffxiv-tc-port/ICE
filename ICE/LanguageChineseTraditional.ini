Off (default): only your own role's targets are drawn - as ground support you no longer see the pilot's giant target, and the other way round.\nShared objects such as the field probe are always drawn for both roles.\nWhen your role cannot be worked out (before you board, or outside an event), or when a target cannot be attributed to either role, everything is drawn as before.\nOn: draws every mecha event target again, whichever role it belongs to.==關閉（預設）：只畫你自己身份的目標——以協助員參加時不會再看到駕駛員的巨型目標，反過來也一樣。\n野外探測器這類兩種身份共用的物件，兩邊都照樣畫。\n判不出你的身份時（還沒上機甲、或不在事件裡），或是某個目標歸不到任何一邊時，一律照舊全部畫出來。\n開啟：不分身份，把機甲事件的目標全部畫回來。
