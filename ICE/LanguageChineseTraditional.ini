The relic tool score bar for the job of your current mission.\nThis is a different line from 'Show Total Score' above, which is the combined one.\nOn by default - turning it off only hides the bars.==目前任務對應職業的宇宙工具成果進度條。\n這跟上面的「顯示總成果」是不同的一列，那一條是全部合計的。\n預設開啟——關掉只是把進度條藏起來。
