Off (default): ICE answers Yes to every shop confirmation, including the game's own warning that you have already learned the item.\nOn: that warning is answered No instead, and the item is skipped for the rest of this shopping trip.\nLeave this off if you deliberately buy already-learned items to resell them - the per-item Skip If Learned column blocks only the items you pick.==關閉（預設）：ICE 對商店的每一個確認框都按下確定，包括遊戲自己跳出來的「目前已經學會了該道具對應的內容」。\n開啟：只有那一種提示會改按取消，並且這一趟採購不再挑這件道具。\n如果你是刻意買已經學會的道具拿去賣，請保持關閉；清單裡逐項的「已學會就不買」只會擋你自己勾選的那幾件。
On: stop buying this item once the game reports that you have already learned it.\nOrchestrion rolls and emote manuals disappear from your bags when learned, so Keep can never be reached and Keep Buying would drain your credits.\nLeave this off if you buy this item in order to resell it.==開啟：遊戲回報你已經學會這件道具之後就不再購買。\n管弦樂琴樂譜與演技教材學會之後就會從背包裡消失，所以「保留」永遠達不到，「一直買」會把宇宙信用點數買光。\n如果你買這件道具是為了轉賣，請保持關閉。
