The plugin ships with a built-in gathering route for every mission flag. Drop your own .yaml into the custom folder and it replaces the built-in route for that same zone and flag - the built-in one is never deleted, so you can always go back.==插件為每一個任務標記都內建了一條採集路線。把你自己的 .yaml 放進自訂資料夾，就會覆寫同一個區域、同一個標記的內建路線；內建的那份永遠不會被刪掉，隨時可以還原。
